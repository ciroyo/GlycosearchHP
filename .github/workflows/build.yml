name: Build and check

# Builds the redesigned site from site/ and runs its checks. It does not publish anything.
# macOS runner: the build uses `sips` for the web-sized image copies.

on:
  push:
    branches: [master, redesign-2026]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build
        run: node scripts/build.mjs
      - name: Check
        run: node scripts/check.mjs --inventory check-data/linkinventar.json --manifest check-data/dateimanifest.json
